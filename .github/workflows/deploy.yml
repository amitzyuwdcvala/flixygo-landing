name: Deploy flixygo.in to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 147.93.104.96
          username: root
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e

            cd /var/www/flixygo-landing

            git fetch --all
            git reset --hard origin/main

            chown -R www-data:www-data /var/www/flixygo-landing
            chmod -R 755 /var/www/flixygo-landing
            find /var/www/flixygo-landing -type f -exec chmod 644 {} \;

            systemctl reload nginx
